name: Release

# Stages the package on npm when a GitHub Release is published. A maintainer then approves the
# staged version with 2FA on npmjs.com (or with `npm stage approve`) before it can be installed.
# The release's tag must match the version in package.json, e.g. v2.4.2.
on:
  release:
    types: [ published ]

permissions:
  contents: read
  # Needed for npm trusted publishing (OIDC) and provenance
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm stage publish requires npm 11.15.0 or later
      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Check that the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Builds dist/ and runs the unit tests
      - name: Unit tests
        run: npm test

      - name: Check that the committed build is up to date
        run: git diff --exit-code -- dist

      # The trusted publisher on npm is stage-only, so this can't make a version installable by itself.
      # A staged version's dist-tag can't be changed later, so it's always set explicitly.
      # Prereleases (e.g. v2.5.0-beta.1) go to "next" so they aren't installed by default.
      - name: Stage on npm
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm stage publish --tag next
          else
            npm stage publish --tag latest
          fi
          echo "::notice::Staged on npm. Approve it at https://www.npmjs.com/package/newsapi under Staged Packages, or with npm stage approve."
