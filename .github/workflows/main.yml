name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20, 22, 24 ]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm test builds dist/ first and runs the unit tests, which mock all requests to newsapi.org
      - name: Unit tests
        run: npm test

      - name: Check that the committed build is up to date
        run: git diff --exit-code -- dist

  live:
    name: Live API tests
    # Requires the API_KEY secret, which isn't available to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Live API tests
        run: npm run test:live
        env:
          API_KEY: ${{ secrets.API_KEY }}
